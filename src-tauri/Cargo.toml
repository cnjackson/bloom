[package]
name = "bloom"
version = "0.1.0"
description = "Bloom — system-wide text replacement for Windows (macOS Text Replacement parity)"
authors = ["Charlie"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# Reserved for the future hook subsystem (windows-rs based fallback
# when rdev's `unstable_grab` fails on a future Rust update). Today we
# ship without the hook — keep the seam for v1.1.
