[package]
name = "bloom"
version = "0.1.0"
description = "Bloom — system-wide text replacement for Windows (macOS Text Replacement parity)"
authors = ["ub42"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# rdev dependency removed: never imported anywhere (Cargo built it with the
# unstable_grab feature but the source only uses direct SetWindowsHookExW
# via windows-rs). Removing shrinks build + removes unused attack surface.
getrandom = "0.2"
serde_json = "1.0"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"

rdev = { version = "0.5", features = ["unstable_grab"] }
arboard = "3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
]


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
